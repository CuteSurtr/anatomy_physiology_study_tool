<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <rect width="1000" height="400" fill="#fefefe"/>

  <!-- Background bands shading -->
  <!-- I band left -->
  <rect x="80" y="80" width="120" height="240" fill="#fef3c7" opacity="0.5"/>
  <!-- A band -->
  <rect x="200" y="80" width="600" height="240" fill="#fee2e2" opacity="0.45"/>
  <!-- I band right -->
  <rect x="800" y="80" width="120" height="240" fill="#fef3c7" opacity="0.5"/>
  <!-- H zone (within A band) -->
  <rect x="380" y="80" width="240" height="240" fill="#dbeafe" opacity="0.55"/>

  <!-- Z discs (vertical lines at the ends) -->
  <line x1="80" y1="60" x2="80" y2="340" stroke="#7f1d1d" stroke-width="8"/>
  <line x1="920" y1="60" x2="920" y2="340" stroke="#7f1d1d" stroke-width="8"/>

  <!-- Thin filaments (actin) from each Z -->
  <g stroke="#0369a1" stroke-width="3.5">
    <line x1="80" y1="120" x2="440" y2="120"/>
    <line x1="80" y1="160" x2="440" y2="160"/>
    <line x1="80" y1="200" x2="440" y2="200"/>
    <line x1="80" y1="240" x2="440" y2="240"/>
    <line x1="80" y1="280" x2="440" y2="280"/>
    <line x1="560" y1="120" x2="920" y2="120"/>
    <line x1="560" y1="160" x2="920" y2="160"/>
    <line x1="560" y1="200" x2="920" y2="200"/>
    <line x1="560" y1="240" x2="920" y2="240"/>
    <line x1="560" y1="280" x2="920" y2="280"/>
  </g>

  <!-- Thick filaments (myosin) in the middle -->
  <g fill="#581c87" stroke="#3b0764" stroke-width="2">
    <rect x="250" y="110" width="500" height="22" rx="10"/>
    <rect x="250" y="150" width="500" height="22" rx="10"/>
    <rect x="250" y="190" width="500" height="22" rx="10"/>
    <rect x="250" y="230" width="500" height="22" rx="10"/>
    <rect x="250" y="270" width="500" height="22" rx="10"/>
  </g>

  <!-- M line (middle) -->
  <line x1="500" y1="80" x2="500" y2="320" stroke="#7f1d1d" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Brackets/labels at top -->
  <g fill="none" stroke="#52525b" stroke-width="1.5">
    <!-- I band left bracket -->
    <line x1="80" y1="55" x2="200" y2="55"/>
    <line x1="80" y1="48" x2="80" y2="55"/>
    <line x1="200" y1="48" x2="200" y2="55"/>
    <!-- A band bracket -->
    <line x1="200" y1="35" x2="800" y2="35"/>
    <line x1="200" y1="28" x2="200" y2="35"/>
    <line x1="800" y1="28" x2="800" y2="35"/>
    <!-- I band right bracket -->
    <line x1="800" y1="55" x2="920" y2="55"/>
    <line x1="800" y1="48" x2="800" y2="55"/>
    <line x1="920" y1="48" x2="920" y2="55"/>
    <!-- H zone bracket bottom -->
    <line x1="380" y1="345" x2="620" y2="345"/>
    <line x1="380" y1="345" x2="380" y2="352"/>
    <line x1="620" y1="345" x2="620" y2="352"/>
  </g>
</svg>
